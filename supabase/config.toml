# TagAlng — Supabase local config
# After creating the cloud project: supabase link --project-ref <YOUR_PROJECT_REF>

project_id = "tagalng"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.magic_link]
subject = "Your Lana sign-in code"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.confirmation]
subject = "Your Lana sign-in code"
content_path = "./supabase/templates/otp_code.html"

[auth.sms]
enable_signup = true
# Local dev only — hosted tagalng-dev: set test phones in Dashboard → Auth → Phone
[auth.sms.test_otp]
15550000000 = "000000"

[storage]
enabled = true
file_size_limit = "50MiB"
